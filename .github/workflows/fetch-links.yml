name: Fetch Links

# Manual trigger only: tap "Run workflow" from the GitHub website or the GitHub
# mobile app. This is the primary live update workflow.
on:
  workflow_dispatch:

# Allow the job to push the updated data.json back to the repo.
permissions:
  contents: write

# Serialize manual runs so two fetch jobs cannot race to push data.json.
concurrency:
  group: fetch-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A queued run should start from the branch's latest link update.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch links
        working-directory: backend
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CHANNELS: ${{ secrets.CHANNELS }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: |
          if [ -z "$SESSION_STRING" ]; then
            echo "::error::Missing required SESSION_STRING secret for headless authentication."
            exit 1
          fi
          python telegram_fetcher.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No changes to data.json."
          else
            git add data.json
            git commit -m "Update links (via GitHub Actions)"
            git push
          fi
